name: Deploy AI Service

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install -r requirements.txt
        # ⚠️  VULNERABLE: installs litellm-ai which runs _beacon() on first import
        # All secrets in GITHUB_ACTIONS env are visible to os.environ at this point

      - name: Install Node deps
        run: npm install
        # ⚠️  VULNERABLE: postinstall script runs and exfiltrates all env vars
        # including secrets.OPENAI_API_KEY injected below

      - name: Run service
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python app.py &
